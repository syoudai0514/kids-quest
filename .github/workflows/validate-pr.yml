name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-monster-art.txt

      - name: Install dependencies and verify image tools
        run: |
          npm ci
          python -m pip install -r scripts/requirements-monster-art.txt
          convert -version
          montage -version

      - name: Check identity policy, data, tests, and build
        env:
          MONSTER_IDENTITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check
